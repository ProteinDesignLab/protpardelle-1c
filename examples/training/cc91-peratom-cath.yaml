# Per-atom hierarchical diffusion model — CATH training
# Based on cc91-peratom.yaml, adapted for CATH dataset
train:
  seed: 0
  ckpt_path: "/scratch/users/tianyulu/protpardelle-1c-experiments/protpardelle-1c/cc91-peratom-cath/checkpoints/epoch24_training_state.pth"
  batch_size: 32
  max_epochs: 10000
  eval_freq: 8000000 # seconds
  checkpoint_freq: 1
  checkpoints: []
  lr: 0.0001
  warmup_steps: 1000
  decay_steps: 2_000_000
  use_amp: True
  clip_grad_norm: True
  grad_clip_val: 1.0
  weight_decay: 0.0
  n_eval_samples: 10
  length_ranges_per_chain: [[166, 188]]
  sc_num_seqs: 4
  eval_loss_t: [0.1, 0.3, 0.5, 0.7, 0.9]
  self_cond_train_prob: 0.9
  subsample_eval_set: 0.05
  crop_conditional: True
  crop_cond:
    contiguous_prob: 0.05
    discontiguous_prob: 0.9
    sidechain_prob: 0.9
    sidechain_only_prob: 0.0
    max_span_len: 12
    max_discontiguous_res: 24
    dist_threshold: 45.0
    recenter_coords: True
    metal_cond_prob: 0.0  # no metals in CATH

data:
  atom_format: "per_atom"
  max_atoms_per_group: 14
  include_metals: False
  pdb_paths: ["/scratch/users/tianyulu/augmented_ingraham_cath_bugfree"]
  mixing_ratios: [1.0]
  fixed_size: 256
  n_aatype_tokens: 21
  se3_data_augment: True
  translation_scale: 1.0
  chain_residx_gap: 200
  sigma_data: 10.01
  auto_calc_sigma_data: True
  n_examples_for_sigma_data: 500
  dummy_fill_mode: "zero"
  subset: ["designable_"]

diffusion:
  training:
    function: "lognormal"
    psigma_mean: -0.5
    psigma_std: 1.5
  sampling:
    function: "uniform"
    s_min: 0.001
    s_max: 80

model:
  task: "ai-allatom-nomask"
  arch: "per_atom"
  pretrained_modules: []
  struct_model_checkpoint: ""
  mpnn_model_checkpoint: ""
  crop_conditional: True
  conditioning_style: "concat"
  compute_loss_on_all_atoms: false
  struct_model:
    arch: "per_atom"
    n_element_types: 128
    element_emb_dim: 16
    n_channel: 256
    noise_cond_mult: 4
    local_attn_window: 48
    local_attn_mode: "window"
    group_pool_mode: "mean"
    cond_proj_dim: 32
    charge_scale: 3.0
    charge_dropout: 0.1
    mass_scale: 250.0
    mass_dropout: 0.1
    void_dropout: 0.1
    uvit:
      patch_size: 1
      n_layers: 10
      n_heads: 8
      dim_head: 32
      n_filt_per_layer: []
      n_blocks_per_layer: 2
      cat_pwd_to_conv: False
      conv_skip_connection: False
      position_embedding_type: "relative"
      position_embedding_max: 32
  mpnn_model:
    use_self_conditioning: True
    label_smoothing: 0.1
    n_channel: 128
    n_layers: 3
    n_neighbors: 32
    noise_cond_mult: 4
