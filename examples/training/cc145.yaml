# cc141 50/50 Teddymer + AI-CATH split, but allatom (cc91-style task) and trained on
# the all-atom AFDB Teddymer set with metadata-driven filtering plus a spatial
# interface crop for long target chains.
train:
  seed: 0
  ckpt_path: "/scratch/users/tianyulu/protpardelle-1c-experiments/protpardelle-1c/cc145/checkpoints/epoch170_training_state.pth"
  batch_size: 128
  max_epochs: 10000
  eval_freq: 8000000 # seconds
  checkpoint_freq: 1
  checkpoints: []
  lr: 0.0001
  warmup_steps: 1000
  decay_steps: 2_000_000
  use_amp: False
  clip_grad_norm: True
  grad_clip_val: 1.0
  weight_decay: 0.0
  n_eval_samples: 10
  length_ranges_per_chain: [[166, 188]]
  sc_num_seqs: 4
  eval_loss_t: [0.1, 0.3, 0.5, 0.7, 0.9]
  self_cond_train_prob: 0.9
  subsample_eval_set: 0.05
  crop_conditional: True
  crop_cond:
    contiguous_prob: 0.05
    discontiguous_prob: 0.05
    sidechain_prob: 0.9
    sidechain_only_prob: 0.0
    max_span_len: 12
    max_discontiguous_res: 24
    dist_threshold: 45.0
    recenter_coords: True
    post_center_jitter_std: 2.0  # small isotropic jitter post-centering (Å) — breaks "motif always at exact origin" prior
    multichain_prob: 0.90
    hotspot_min: 3
    hotspot_max: 20
    hotspot_dropout: 0.0
    paratope_prob: 0.1

data:
  pdb_paths:
    [
      "/scratch/users/tianyulu/datasets/teddymer/afdb_teddymer_v2",
      "/scratch/users/tianyulu/augmented_ingraham_cath_bugfree",
    ]
  mixing_ratios: [0.5, 0.5]
  fixed_size: 512
  n_aatype_tokens: 21
  se3_data_augment: True
  translation_scale: 1.0
  chain_residx_gap: 200 # residue index gap for chain breaks for PDBs with multiple chains
  sigma_data: 10.01
  auto_calc_sigma_data: True # If true, override sigma_data with value computed at runtime
  n_examples_for_sigma_data: 500 # Number of examples to use for computing sigma_data
  dummy_fill_mode: "CA" # fill ghost side chain atoms with one of ["zero", "CA", "CB"]
  subset: ["", "designable_"] # "" for Teddymer (all examples), "designable_" for AI-CATH

  # DSSP CSVs (one per dataset, aligned with pdb_paths). Each row is
  # `pdb_code,source_pdb,length,sse` where sse is a per-residue H/E/L string.
  # The teddymer CSV is produced by scripts/dssp/run_dssp_teddymer.sbatch.
  dssp_csv:
    - "/scratch/users/tianyulu/datasets/teddymer/afdb_teddymer_v2_dssp.csv"
    - "/scratch/users/tianyulu/augmented_ingraham_cath_bugfree/train_dssp.csv"

  # Teddymer all-atom metadata filtering. Path will be repointed once the
  # post-processing run finishes; columns missing from the TSV are skipped, so
  # this works even with a partially-populated table.
  metadata_tsv: "/scratch/users/tianyulu/datasets/teddymer/afdb_teddymer_v2_metadata.tsv"
  teddymer_filters:
    rg_norm_max: 4.0          # normalized radius of gyration cap (per chain)
    n_contacts_min: 10        # minimum interface contacts (placeholder threshold)
    n_polar_min: 2            # minimum polar interface contacts (placeholder threshold)
    n_hydrophobic_max: 50     # maximum hydrophobic interface contacts (placeholder threshold)
    filename_col: "filename"
    # Pre-filter pairs whose to-be-generated chain would exceed long_chain_max_len.
    # Defaults match the AFDB Teddymer annotation pipeline; rename once the real
    # post-processed TSV settles.
    chain_a_len_col: "actual_N_A"
    chain_b_len_col: "actual_N_B"

  # Spatial interface crop for long target chains in dimers. Any chain longer
  # than long_chain_max_len keeps only the residues whose CA is closest to the
  # partner chain; dropped residues become gaps in residue_index so the
  # relative position embedding still encodes the original spacing (clipped at
  # position_embedding_max).
  long_chain_spatial_crop: True
  long_chain_max_len: 256

diffusion:
  training:
    function: "lognormal"
    psigma_mean: -0.5
    psigma_std: 1.5
  sampling:
    function: "uniform"
    s_min: 0.001
    s_max: 80

model:
  task: "ai-allatom-nomask" # cc91-style allatom denoising
  pretrained_modules: [] # 'struct_model', 'mpnn_model'
  struct_model_checkpoint: ""
  mpnn_model_checkpoint: ""
  crop_conditional: True
  # concat: standard motif crop coords channels
  # hotspots: extra channel marking hotspot residues
  # binderprop: global (h, e, l) fraction broadcast across non-motif binder
  #   residues, quantized to 0.1 bins (3 channels). 50% CFG dropout per sample.
  # Note: per-residue motif DSSP (the "dssp" channel) is intentionally omitted —
  # the target's clean coords (struct_crop_cond) already encode its secondary
  # structure, so an extra one-hot SS label at motif positions is redundant.
  conditioning_style: "concat_hotspots_binderprop"
  compute_loss_on_all_atoms: false
  struct_model:
    arch: "dit"
    n_atoms: 37
    n_channel: 256
    noise_cond_mult: 4
    uvit:
      patch_size: 1
      n_layers: 10
      n_heads: 8
      dim_head: 32
      n_filt_per_layer: []
      n_blocks_per_layer: 2
      cat_pwd_to_conv: False
      conv_skip_connection: False
      position_embedding_type: "relative"
      position_embedding_max: 32
  mpnn_model:
    use_self_conditioning: True
    label_smoothing: 0.1
    n_channel: 128
    n_layers: 3
    n_neighbors: 32
    noise_cond_mult: 4
