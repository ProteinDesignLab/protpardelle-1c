# cc144 (concat+condmask+dssp) but trained from scratch with:
#  - flanking-residue DSSP conditioning (1-10 residues on each side, sampled per side per sample)
#    so sampling can specify SSE for more than just the motif itself.
#  - global scaffold-level SSE-proportion conditioning (binderprop) with 50% CFG dropout
#    so sampling can also bias overall scaffold helix/strand/loop composition.
train:
  seed: 0
  ckpt_path: ""
  ckpt_optim: false
  batch_size: 128
  max_epochs: 10000
  eval_freq: 8000000 # seconds
  checkpoint_freq: 1
  checkpoints: []
  lr: 0.0001
  warmup_steps: 1000
  decay_steps: 2_000_000
  use_amp: False
  clip_grad_norm: True
  grad_clip_val: 1.0
  weight_decay: 0.0
  n_eval_samples: 10
  length_ranges_per_chain: [[166, 188]]
  fpd_length_ranges_per_chain: [[50, 256]]
  n_fpd_samples: 0
  sc_num_seqs: 4
  eval_loss_t: [0.1, 0.3, 0.5, 0.7, 0.9]
  self_cond_train_prob: 0.9
  subsample_eval_set: 0.05
  shapes_path: /scratch/users/tianyulu/protein_shapes
  phema:
    enabled: True
    stds: [0.050, 0.100]
  crop_conditional: True
  crop_cond:
    contiguous_prob: 0.05
    discontiguous_prob: 0.9
    cond_mode_probs:
      backbone_only: 0.05
      all_atom: 0.05
      tip_only: 0.60
      acidic_tip_only: 0.25
      sidechain_only: 0.05
    max_span_len: 12
    max_discontiguous_res: 24
    dist_threshold: 45.0
    recenter_coords: True

data:
  pdb_paths: ["/scratch/users/tianyulu/augmented_ingraham_cath_bugfree"]
  mixing_ratios: [1.0]
  fixed_size: 256
  n_aatype_tokens: 21
  se3_data_augment: True
  translation_scale: 1.0
  chain_residx_gap: 200
  sigma_data: 10.47
  auto_calc_sigma_data: True
  n_examples_for_sigma_data: 500
  dummy_fill_mode: "CA"
  subset: ["designable_"]
  dssp_csv: "/scratch/users/tianyulu/augmented_ingraham_cath_bugfree/train_dssp.csv"

diffusion:
  training:
    function: "lognormal"
    psigma_mean: -0.5
    psigma_std: 1.5
  sampling:
    function: "uniform"
    s_min: 0.001
    s_max: 80

model:
  task: "ai-allatom-nomask"
  pretrained_modules: []
  struct_model_checkpoint: ""
  mpnn_model_checkpoint: ""
  full_mpnn_model_path: /scratch/users/tianyulu/farfalle/ProteinMPNN/vanilla_model_weights
  crop_conditional: True
  conditioning_style: "concat+condmask+dssp+binderprop"
  # Per-sample random flank width (left/right independently sampled in [1, motif_dssp_flank_max]).
  # Flank residues receive DSSP one-hot in motif_sse_cond but no coord conditioning.
  motif_dssp_flank_max: 10
  compute_loss_on_all_atoms: false
  struct_model:
    arch: "dit"
    n_atoms: 37
    n_channel: 512
    noise_cond_mult: 4
    uvit:
      patch_size: 1
      n_layers: 20
      n_heads: 8
      dim_head: 64
      n_filt_per_layer: []
      n_blocks_per_layer: 2
      cat_pwd_to_conv: False
      conv_skip_connection: False
      position_embedding_type: "relative"
      position_embedding_max: 32
  mpnn_model:
    use_self_conditioning: True
    label_smoothing: 0.1
    n_channel: 128
    n_layers: 3
    n_neighbors: 32
    noise_cond_mult: 4
