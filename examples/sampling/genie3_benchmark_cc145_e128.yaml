# Global binder SS proportion (helix, strand, loop) — broadcast across every
# non-motif residue at sample time. Quantized to 0.1 bins to match training.
# Default = mostly helical (0.6 H, 0.0 E, 0.4 L) since helical binders fold
# more reliably and were one of the motivations for adding this conditioning.
