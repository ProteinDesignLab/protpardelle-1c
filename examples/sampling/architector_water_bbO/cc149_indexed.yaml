# Architector REE coordination geometries sampling — cc149 (concat + condmask).
#
# Indexed counterpart of cc148_unindexed.yaml. Contigs place each motif residue
# (including HOH water placeholders, which are appended at PDB residue numbers
# continuing from the last ASP) at a discontiguous scaffold position. Scaffold
# gaps "4-9" are heuristic and can be tightened/relaxed per motif geometry.
#
# Conditioning strategy "acidic-tip+water-bbO":
#   - ASP/GLU -> RFdiffusion tip atoms (CB/CG/OD1/OD2, etc.)
#   - HOH placeholder residues (appended PDB residue numbers, see per-motif contigs) -> only backbone O (atom index 4); MPNN designs that scaffold position freely
#
# Requires cc149 weights+config installed under $PROTPARDELLE_MODEL_PARAMS.
# NOTE: epoch number is a placeholder; update once cc149 has trained long enough.

search_space:
  models:
    - ["cc149", "100", "sampling_acidic_tip_water_bbO_condmask_allatom_s1"]
  step_scales: [1.2]
  schurns: [200]
  crop_cond_starts: [0.0]
  translations:
    - [0.0, 0.0, 0.0]

motifs:
  - la_acetate4_water2_cn10_axial_bicapped_hexagonal_planar_0_nunpairedes_0_charge_-1
  - la_acetate5_cn10_axial_bicapped_hexagonal_planar_0_nunpairedes_0_charge_-2
  - nd_acetate_water_cn9_am_c3_9H2O_c0_0_nunpairedes_0_charge_-1
  - dy_acetate_water_cn9_tricapped_trigonal_prismatic_0_nunpairedes_0_charge_-1

# Residue numbers refer to the post-HOH-injection layout: ASPs at PDB
# residue 2..(2+n_asp-1); HOH oxygens continue at the next numbers.
motif_contigs:
  # la_acetate4_water2: 4 ASP (A2-A5) + 2 HOH (A6, A7)
  - "5-40;A2-2;4-9;A3-3;4-9;A4-4;4-9;A5-5;4-9;A6-6;4-9;A7-7"
  # la_acetate5: 5 ASP (A2-A6), no waters
  - "5-40;A2-2;4-9;A3-3;4-9;A4-4;4-9;A5-5;4-9;A6-6"
  # nd_acetate_water_cn9: 4 ASP (A2-A5) + 1 HOH (A6)
  - "5-40;A2-2;4-9;A3-3;4-9;A4-4;4-9;A5-5;4-9;A6-6"
  # dy_acetate_water_cn9: 4 ASP (A2-A5) + 1 HOH (A6)
  - "5-40;A2-2;4-9;A3-3;4-9;A4-4;4-9;A5-5;4-9;A6-6"

total_lengths:
  - [[80, 120]]
  - [[80, 120]]
  - [[80, 120]]
  - [[80, 120]]

hotspots:
  - null
  - null
  - null
  - null

ssadj:
  - null
  - null
  - null
  - null
