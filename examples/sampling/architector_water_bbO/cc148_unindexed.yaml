# Architector REE coordination geometries sampling — cc148 (unindexed + condmask).
#
# Conditioning strategy "acidic-tip+water-bbO" treats each motif PDB as:
#   - ASP/GLU acetate residues -> conditioned on RFdiffusion tip atoms (CB, CG, OD1, OD2 / CG, CD, OE1, OE2)
#   - HOH water oxygens -> injected as fake motif residues whose only conditioned atom is the backbone O (atom index 4); the matched scaffold position is designed freely by ProteinMPNN
#
# Requires cc148 weights+config installed under $PROTPARDELLE_MODEL_PARAMS as
#   weights/cc148_epoch{N}.pth and configs/cc148.yaml (symlinks ok).
#
# NOTE: epoch number is a placeholder; update once cc148 has trained long enough.

search_space:
  models:
    - ["cc148", "100", "sampling_acidic_tip_water_bbO_condmask_allatom_s1"]
  step_scales: [1.2]
  schurns: [200]
  crop_cond_starts: [0.0]
  translations:
    - [0.0, 0.0, 0.0]

motifs:
  - la_acetate4_water2_cn10_axial_bicapped_hexagonal_planar_0_nunpairedes_0_charge_-1
  - la_acetate5_cn10_axial_bicapped_hexagonal_planar_0_nunpairedes_0_charge_-2
  - nd_acetate_water_cn9_am_c3_9H2O_c0_0_nunpairedes_0_charge_-1
  - dy_acetate_water_cn9_tricapped_trigonal_prismatic_0_nunpairedes_0_charge_-1

motif_contigs:
  - "unindexed"
  - "unindexed"
  - "unindexed"
  - "unindexed"

total_lengths:
  - [[80, 120]]
  - [[80, 120]]
  - [[80, 120]]
  - [[80, 120]]

hotspots:
  - null
  - null
  - null
  - null

ssadj:
  - null
  - null
  - null
  - null
