motif_sse:
  - HHH   # all alpha helix (3 motif residues: A2, A3, A4)
  - EEE   # all beta strand
  - HHH
  - EEE
# Per-motif SSE flank size (residues on each side that inherit the motif's SSE
# label). cc147 was trained with motif_dssp_flank_max=10, so [1, 10] is in-distribution.
# Helices need ~10+ residues to be rigid; bumping HHH to 10 (21-residue helical
# region around each motif residue). Sheets work at flank=3.
motif_sse_flank:
  - 10
  - 3
  - 10
  - 3
