partial_diffusion:
  enabled: true
  rewind_steps: [150]
search_space:
  models:
    - ["cc94_pmhcFT_2", "3580", "sampling_sidechain_conditional_partial_diffusion_allatom"] # single chain model, allatom but must always give ground truth sequence
  step_scales: [1.0] # don't do SDE sampling to faithfully sample from what the model learns
  schurns: [0]
  crop_cond_starts: [0.0]
  translations:
    - [0.0, 0.0, 0.0]
motifs:
  - 8EMI_reordered
motif_contigs:
  - A1-180;/;9-9
total_lengths:
  - [[180, 180], [9, 9]]
hotspots:
  - null
ssadj:
  - null
