model:
  model_ckpt: "" # Path to denoiser model weights
  model_cfg: "" # Path to denoiser model config
  minimpnn_path: "" # Path to minimpnn model weights
  full_mpnn_path: "" # If provided, replace full MPNN in model_cfg with this path

sampling:
  n_steps: 500 # number of denoising steps
  s_churn: 200 # add s_churn / n_steps amount of noise when noise level is between s_max and s_min
  step_scale: 1.2 # inverse temperature, 1.0 is taking denoising steps exactly according to model's predictions, 0.8 is higher temperature
  noise_schedule:
    _partial_: true
    _target_: "protpardelle.core.diffusion.noise_schedule"
    s_max: 80 # start applying schurn after this noise level
    s_min: 0.001 # stop applying schurn after this noise level
  motif_file_path: # input motif, can also be a directory of motifs
  partial_diffusion:
    enabled: false # use partial diffusion
    pdb_file_path: # input pdb to apply partial diffusion
    n_steps: 100 # go back these many steps, 100 here with sampling.n_steps=500 means going back to step 400
  dx: 0.0 # translate motif in x-axis
  dy: 0.0 # translate motif in y-axis
  dz: 0.0 # translate motif in z-axis
  conditional_cfg:
    enabled: true # when true, run conditional sampling, set to false for unconditional sampling
    discontiguous_motif_assignment:
      enabled: true # set to true if motif is discontiguous (treat each residue independently)
      strategy: "fixed"
      fixed_motif_pos: []
    num_recurrence_steps: 1 # from Universal Guidance paper: repeat each denoising step these many times
    crop_conditional_guidance:
      enabled: true
      start: 0.0
      end: 2.0
      freq: 1 # apply crop-conditional info every {freq} many steps (e.g. 2 means one step unconditional, one step conditional)
      freq_start: 0.0
      freq_end: 0.0 # after this, go back to constant crop conditional guidance
      strategy: "acidic-tip+tyr-full" # only condition on ASP/GLU tip atoms (OD1/OD2/CB/CG for ASP, OE1/OE2/CG/CD for GLU)
    reconstruction_guidance:
      enabled: false
      start: 0.0
      end: 2.0
      schedule: "custom" # ['constant', 'quadratic', 'cubic', 'custom']
      max_scale: 10.0 # max scalar scaling applied to reconstruction guidance gradient
      loss_weights:
        motif: 1.0
    replacement_guidance:
      enabled: false
      start: 0.0
      end: 0.92

  allatom_cfg:
    sidechain_mode: true
    skip_mpnn_proportion: 0.6
    use_fullmpnn: false
    use_fullmpnn_for_final: true
    anneal_seq_resampling_rate: "linear"
    jump_steps: true
    uniform_steps: false
    caliby_ensemble:
      enabled: false                    # set true to replace MPNN with Caliby ensemble design
      ensemble_size: 32                 # number of decoys to generate per main sample
      checkpoint: "caliby"              # caliby | soluble_caliby | soluble_caliby_v1
      # Beam strategy for the 350->500 ensemble branch. `backbone_only` is the
      # canonical flow: use cc95 (or cc58/bb81) to denoise only the backbone for
      # the 32-member ensemble, pass to Caliby. The other strategies exist but
      # don't produce usable ensembles with unindexed models (cc137 partial_diffusion
      # diverges).
      beam_strategy: "backbone_only"    # backbone_only | minimpnn | uniform_random | caliby_x0
      rewind_steps: 150                 # matches 70% point when n_steps=500
      venv_python: "/scratch/users/tianyulu/envs/caliby/bin/python"
      caliby_script: null               # auto-resolved to scripts/run_caliby_ensemble.py
      model_params_dir: "/oak/stanford/groups/possu/tianyu/models/caliby"
      backbone_model_name: "cc95"       # bb model used for ensemble generation
      backbone_model_epoch: 3490
      caliby_x0_freq: 15
      uniform_random_seed: null

  stage2_cfg:
    enabled: false
    rewind_steps: 50
    n_steps: 200
    s_churn: 200
    step_scale: 1.2
    sidechain_mode: true
    skip_mpnn_proportion: 1.0
    noise_schedule:
      _partial_: true
      _target_: "protpardelle.core.diffusion.noise_schedule"
      s_max: 80
      s_min: 0.001

hydra:
  run:
    dir: ""
